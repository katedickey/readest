<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send to Readest — Options</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #666;
        --surface: #ffffff;
        --raised: #f5f5f5;
        --border: #e5e5e5;
        --accent: #1a1a1a;
        --accent-fg: #ffffff;
        --ok: #1e8e3e;
        --err: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0f0f0;
          --muted: #a8a8a8;
          --surface: #1a1a1a;
          --raised: #262626;
          --border: #333;
          --accent: #f0f0f0;
          --accent-fg: #1a1a1a;
          --ok: #4ade80;
          --err: #f87171;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--surface);
        color: var(--fg);
      }
      body {
        width: 420px;
        padding: 20px;
        font:
          13px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
      }
      p.help {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 13px;
        color: var(--fg);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
      }
      input[type='text']:focus {
        border-color: var(--accent);
      }
      .row-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button.primary {
        flex: 1;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent-fg);
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button.secondary {
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
      }
      .status.ok {
        color: var(--ok);
      }
      .status.err {
        color: var(--err);
      }
      .status:empty {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="Send to Readest — Options"></h1>
    <p
      class="help"
      data-i18n="Point the extension at a self-hosted Readest server. Leave blank to use the default (web.readest.com)."
    ></p>

    <label for="server-url" data-i18n="Server URL"></label>
    <input
      id="server-url"
      type="text"
      placeholder="https://readest.example.com"
      autocomplete="off"
      spellcheck="false"
    />

    <div class="row-actions">
      <button id="save" class="primary" data-i18n="Save"></button>
      <button id="reset" class="secondary" data-i18n="Reset"></button>
    </div>

    <p id="status" class="status"></p>

    <script src="options.js" defer></script>
  </body>
</html>
